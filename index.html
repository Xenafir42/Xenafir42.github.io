<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University Timetable</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .timetable-container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .timetable {
            display: grid;
            grid-template-columns: 90px repeat(5, 1fr);
            grid-template-rows: 70px repeat(6, 90px);

            border-left: 1px solid #d5dbe1;
            border-top: 1px solid #d5dbe1;
        }

        .header {
            background: #1f2937;
            color: white;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;

            border-right: 1px solid #374151;
            border-bottom: 1px solid #374151;
        }

        .time {
            background: #f8fafc;
            font-weight: bold;
            font-size: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-right: 1px solid #d5dbe1;
            border-bottom: 1px solid #d5dbe1;
        }

        .cell {
            border-right: 1px solid #d5dbe1;
            border-bottom: 1px solid #d5dbe1;
            background: white;
        }

        .class {
            margin: 5px;
            padding: 9px;

            border-radius: 7px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            border: 1px solid #cbd5e1;

            z-index: 2;

            cursor: pointer;

            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .class:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        .class-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .class-type {
            font-size: 12px;
            color: #475569;
            margin-bottom: 4px;
        }

        .class-location {
            font-size: 12px;
            color: #334155;
        }

        .class-time {
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
        }

        .course {
            background: #dbeafe;
            border-left: 5px solid #2563eb;
        }

        .seminar {
            background: #dcfce7;
            border-left: 5px solid #16a34a;
        }

        .laboratory {
            background: #fce7f3;
            border-left: 5px solid #db2777;
        }

        .default {
            background: #f3e8ff;
            border-left: 5px solid #9333ea;
        }


        /* =========================
           MODAL
           ========================= */

        .modal {
            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.5);

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;

            width: 100%;
            max-width: 550px;

            padding: 25px;

            border-radius: 10px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

            position: relative;

            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;

            right: 15px;
            top: 10px;

            width: 35px;
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: bold;

            cursor: pointer;

            color: #64748b;

            border-radius: 50%;
        }

        .modal-close:hover {
            background: #f1f5f9;
            color: #111827;
        }

        .modal-title {
            margin: 0 45px 25px 0;

            font-size: 22px;

            color: #111827;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section strong {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            color: #334155;
        }

        .modal-comment {
            color: #475569;

            line-height: 1.5;

            white-space: pre-wrap;

            background: #f8fafc;

            padding: 12px;

            border-radius: 6px;

            min-height: 20px;
        }

        .modal-url {
            color: #2563eb;

            word-break: break-all;

            text-decoration: none;
        }

        .modal-url:hover {
            text-decoration: underline;
        }

        .modal-no-data {
            color: #94a3b8;
            font-style: italic;
        }


        @media (max-width: 800px) {

            body {
                padding: 10px;
            }

            .timetable {
                min-width: 850px;
            }

            .timetable-container {
                overflow-x: auto;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>


<body>

    <div class="timetable-container">

        <h1>University Timetable</h1>

        <div id="timetable" class="timetable"></div>

    </div>


    <!-- =========================
         MODAL
         ========================= -->

    <div id="classModal" class="modal">

        <div class="modal-content">

            <span id="modalClose" class="modal-close">&times;</span>

            <h2 id="modalTitle" class="modal-title">
                Class
            </h2>


            <div class="modal-section">

                <strong>Comment:</strong>

                <div id="modalComment" class="modal-comment">
                </div>

            </div>


            <div class="modal-section">

                <strong>URL:</strong>

                <a
                    id="modalUrl"
                    class="modal-url"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer">
                </a>

            </div>

        </div>

    </div>


    <!--
        FONTOS:
        A valami.js tartalmazza a timetable tömböt,
        ezért ezt az inline script előtt töltjük be.
    -->

    <script src="valami.js"></script>


    <script>

        const days = [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday"
        ];


        const timeSlots = [
            ["08:00", "10:00"],
            ["10:00", "12:00"],
            ["12:00", "14:00"],
            ["14:00", "16:00"],
            ["16:00", "18:00"],
            ["18:00", "20:00"]
        ];


        const timetableElement =
            document.getElementById("timetable");


        /* =========================
           MODAL ELEMENTS
           ========================= */

        const modal =
            document.getElementById("classModal");

        const modalClose =
            document.getElementById("modalClose");

        const modalTitle =
            document.getElementById("modalTitle");

        const modalComment =
            document.getElementById("modalComment");

        const modalUrl =
            document.getElementById("modalUrl");


        /* =========================
           OPEN MODAL
           ========================= */

        function openClassModal(item) {

            /*
             * Title
             */

            modalTitle.textContent =
                item.name || "Class";


            /*
             * Comment
             */

            if (
                item.comment &&
                item.comment.trim() !== ""
            ) {

                modalComment.textContent =
                    item.comment.trim();

                modalComment.classList.remove(
                    "modal-no-data"
                );

            } else {

                modalComment.textContent =
                    "No comment available.";

                modalComment.classList.add(
                    "modal-no-data"
                );

            }


            /*
             * URL
             *
             * A te objektumaidban a mező neve:
             *
             * location_url
             */

            if (
                item.location_url &&
                item.location_url.trim() !== ""
            ) {

                modalUrl.textContent =
                    item.location_url.trim();

                modalUrl.href =
                    item.location_url.trim();

                modalUrl.style.display =
                    "inline";

            } else {

                modalUrl.textContent =
                    "No URL available.";

                modalUrl.removeAttribute("href");

                modalUrl.style.display =
                    "inline";

            }


            /*
             * Show modal
             */

            modal.classList.add("show");

        }


        /* =========================
           CLOSE MODAL
           ========================= */

        function closeClassModal() {

            modal.classList.remove("show");

        }


        /*
         * Close button
         */

        modalClose.addEventListener(
            "click",
            closeClassModal
        );


        /*
         * Click outside modal
         */

        modal.addEventListener(
            "click",
            function (event) {

                if (event.target === modal) {

                    closeClassModal();

                }

            }
        );


        /*
         * ESC key
         */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Escape") {

                    closeClassModal();

                }

            }
        );


        /* =========================
           HEADER
           ========================= */

        const timeHeader =
            document.createElement("div");

        timeHeader.className =
            "header";

        timeHeader.textContent =
            "Time";

        timeHeader.style.gridColumn =
            "1";

        timeHeader.style.gridRow =
            "1";

        timetableElement.appendChild(
            timeHeader
        );


        days.forEach((day, index) => {

            const header =
                document.createElement("div");

            header.className =
                "header";

            header.textContent =
                day;

            header.style.gridColumn =
                index + 2;

            header.style.gridRow =
                "1";

            timetableElement.appendChild(
                header
            );

        });


        /* =========================
           EMPTY CELLS + TIME LABELS
           ========================= */

        timeSlots.forEach(
            (slot, rowIndex) => {

                const row =
                    rowIndex + 2;


                /*
                 * Time
                 */

                const time =
                    document.createElement("div");

                time.className =
                    "time";

                time.textContent =
                    `${slot[0]}–${slot[1]}`;

                time.style.gridColumn =
                    "1";

                time.style.gridRow =
                    row;

                timetableElement.appendChild(
                    time
                );


                /*
                 * Empty cells
                 */

                days.forEach(
                    (day, dayIndex) => {

                        const cell =
                            document.createElement(
                                "div"
                            );

                        cell.className =
                            "cell";

                        cell.style.gridColumn =
                            dayIndex + 2;

                        cell.style.gridRow =
                            row;

                        timetableElement.appendChild(
                            cell
                        );

                    }
                );

            }
        );


        /* =========================
           CONVERT TIME TO MINUTES
           ========================= */

        function toMinutes(time) {

            const [
                hours,
                minutes
            ] = time
                .split(":")
                .map(Number);

            return (
                hours * 60 +
                minutes
            );

        }


        /* =========================
           ADD CLASSES
           ========================= */

        timetable.forEach(item => {

            /*
             * Safety check
             */

            if (
                !item ||
                !item.time
            ) {
                return;
            }


            /*
             * Find day
             */

            const dayIndex =
                days.indexOf(
                    item.time.day
                );


            if (dayIndex === -1) {
                return;
            }


            /*
             * Start / end
             */

            const start =
                toMinutes(
                    item.time.start
                );

            const end =
                toMinutes(
                    item.time.over
                );


            /*
             * Find starting 2-hour slot
             */

            let slotIndex = -1;


            timeSlots.forEach(
                (slot, index) => {

                    const slotStart =
                        toMinutes(
                            slot[0]
                        );

                    const slotEnd =
                        toMinutes(
                            slot[1]
                        );


                    if (
                        start >= slotStart &&
                        start < slotEnd
                    ) {

                        slotIndex =
                            index;

                    }

                }
            );


            if (slotIndex === -1) {
                return;
            }


            /*
             * Duration
             */

            const duration =
                end - start;


            const rowSpan =
                Math.max(
                    1,
                    Math.ceil(
                        duration / 120
                    )
                );


            /*
             * Create class
             */

            const classElement =
                document.createElement(
                    "div"
                );

            classElement.className =
                "class";


            /* =========================
               CLASS TYPE
               ========================= */

            if (item.type) {

                const type =
                    item.type
                        .split(",")[0]
                        .trim()
                        .toLowerCase();


                if (
                    type === "course" ||
                    type === "seminar" ||
                    type === "laboratory"
                ) {

                    classElement.classList.add(
                        type
                    );

                } else {

                    classElement.classList.add(
                        "default"
                    );

                }

            } else {

                classElement.classList.add(
                    "default"
                );

            }


            /* =========================
               NAME
               ========================= */

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "class-name";

            name.textContent =
                item.name || "Unnamed class";

            classElement.appendChild(
                name
            );


            /* =========================
               TYPE
               ========================= */

            if (item.type) {

                const type =
                    document.createElement(
                        "div"
                    );

                type.className =
                    "class-type";

                type.textContent =
                    item.type;

                classElement.appendChild(
                    type
                );

            }


            /* =========================
               LOCATION
               ========================= */

            if (
                item.location &&
                item.location.trim() !== ""
            ) {

                const location =
                    document.createElement(
                        "div"
                    );

                location.className =
                    "class-location";

                location.textContent =
                    item.location.trim();

                classElement.appendChild(
                    location
                );

            }


            /* =========================
               EXACT TIME
               ========================= */

            const classTime =
                document.createElement(
                    "div"
                );

            classTime.className =
                "class-time";

            classTime.textContent =
                `${item.time.start}–${item.time.over}`;

            classElement.appendChild(
                classTime
            );


            /* =========================
               POSITION
               ========================= */

            classElement.style.gridColumn =
                dayIndex + 2;

            classElement.style.gridRow =
                `${slotIndex + 2} / span ${rowSpan}`;


            /* =========================
               CLICK EVENT
               ========================= */

            classElement.addEventListener(
                "click",
                function () {

                    openClassModal(item);

                }
            );


            /*
             * Add class to timetable
             */

            timetableElement.appendChild(
                classElement
            );

        });

    </script>

</body>

</html>
