<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University Timetable</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .timetable-container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .timetable {
            display: grid;
            grid-template-columns: 90px repeat(5, 1fr);
            grid-template-rows: 70px repeat(6, 90px);

            border-left: 1px solid #d5dbe1;
            border-top: 1px solid #d5dbe1;
        }

        .header {
            background: #1f2937;
            color: white;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;

            border-right: 1px solid #374151;
            border-bottom: 1px solid #374151;
        }

        .time {
            background: #f8fafc;
            font-weight: bold;
            font-size: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-right: 1px solid #d5dbe1;
            border-bottom: 1px solid #d5dbe1;
        }

        .cell {
            border-right: 1px solid #d5dbe1;
            border-bottom: 1px solid #d5dbe1;
            background: white;
        }

        .class {
            margin: 5px;
            padding: 9px;

            border-radius: 7px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            border: 1px solid #cbd5e1;

            z-index: 2;
        }

        .class-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .class-type {
            font-size: 12px;
            color: #475569;
            margin-bottom: 4px;
        }

        .class-location {
            font-size: 12px;
            color: #334155;
        }

        .class-time {
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
        }

        .course {
            background: #dbeafe;
            border-left: 5px solid #2563eb;
        }

        .seminar {
            background: #dcfce7;
            border-left: 5px solid #16a34a;
        }

        .laboratory {
            background: #fce7f3;
            border-left: 5px solid #db2777;
        }

        .default {
            background: #f3e8ff;
            border-left: 5px solid #9333ea;
        }

        @media (max-width: 800px) {
            body {
                padding: 10px;
            }

            .timetable {
                min-width: 850px;
            }

            .timetable-container {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

    <div class="timetable-container">

        <h1>University Timetable</h1>

        <div id="timetable" class="timetable"></div>

    </div>


    <script src="valami.js"></script>

    <script>

        const days = [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday"
        ];

        const timeSlots = [
            ["08:00", "10:00"],
            ["10:00", "12:00"],
            ["12:00", "14:00"],
            ["14:00", "16:00"],
            ["16:00", "18:00"],
            ["18:00", "20:00"]
        ];

        const timetableElement = document.getElementById("timetable");


        /* Header */

        const timeHeader = document.createElement("div");

        timeHeader.className = "header";
        timeHeader.textContent = "Time";

        timeHeader.style.gridColumn = "1";
        timeHeader.style.gridRow = "1";

        timetableElement.appendChild(timeHeader);


        days.forEach((day, index) => {

            const header = document.createElement("div");

            header.className = "header";
            header.textContent = day;

            header.style.gridColumn = index + 2;
            header.style.gridRow = 1;

            timetableElement.appendChild(header);

        });


        /* Empty cells + time labels */

        timeSlots.forEach((slot, rowIndex) => {

            const row = rowIndex + 2;

            /* Time */

            const time = document.createElement("div");

            time.className = "time";
            time.textContent = `${slot[0]}–${slot[1]}`;

            time.style.gridColumn = 1;
            time.style.gridRow = row;

            timetableElement.appendChild(time);


            /* Empty cells */

            days.forEach((day, dayIndex) => {

                const cell = document.createElement("div");

                cell.className = "cell";

                cell.style.gridColumn = dayIndex + 2;
                cell.style.gridRow = row;

                timetableElement.appendChild(cell);

            });

        });


        /* Convert time to minutes */

        function toMinutes(time) {

            const [hours, minutes] = time.split(":").map(Number);

            return hours * 60 + minutes;
        }


        /* Add classes */

        timetable.forEach(item => {

            const dayIndex = days.indexOf(item.time.day);

            if (dayIndex === -1) return;


            const start = toMinutes(item.time.start);
            const end = toMinutes(item.time.over);


            /* Find the starting 2-hour slot */

            let slotIndex = -1;

            timeSlots.forEach((slot, index) => {

                const slotStart = toMinutes(slot[0]);
                const slotEnd = toMinutes(slot[1]);

                if (start >= slotStart && start < slotEnd) {
                    slotIndex = index;
                }

            });


            if (slotIndex === -1) return;


            /* How many 2-hour slots does the class use? */

            const duration = end - start;

            const rowSpan = Math.ceil(duration / 120);


            /* Create class */

            const classElement = document.createElement("div");

            classElement.className = "class";


            /* Class type */

            if (item.type) {

                const type = item.type
                    .split(",")[0]
                    .trim()
                    .toLowerCase();

                if (
                    type === "course" ||
                    type === "seminar" ||
                    type === "laboratory"
                ) {
                    classElement.classList.add(type);
                } else {
                    classElement.classList.add("default");
                }

            } else {

                classElement.classList.add("default");

            }


            /* Name */

            const name = document.createElement("div");

            name.className = "class-name";
            name.textContent = item.name;

            classElement.appendChild(name);


            /* Type */

            if (item.type) {

                const type = document.createElement("div");

                type.className = "class-type";
                type.textContent = item.type;

                classElement.appendChild(type);

            }


            /* Location */

            if (item.location && item.location.trim() !== "") {

                const location = document.createElement("div");

                location.className = "class-location";
                location.textContent = item.location.trim();

                classElement.appendChild(location);

            }


            /* Exact time */

            const classTime = document.createElement("div");

            classTime.className = "class-time";

            classTime.textContent =
                `${item.time.start}–${item.time.over}`;

            classElement.appendChild(classTime);


            /*
             * Position
             *
             * Row 1 = header
             * Row 2 = 08:00-10:00
             * Row 3 = 10:00-12:00
             * Row 4 = 12:00-14:00
             * etc.
             */

            classElement.style.gridColumn = dayIndex + 2;

            classElement.style.gridRow =
                `${slotIndex + 2} / span ${rowSpan}`;


            timetableElement.appendChild(classElement);

        });

    </script>

</body>

</html>
